<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-ide</title>
<style>
  /* Every size, space and colour comes from here. */
  :root { --s: .25rem; --m: .5rem; --l: 1rem; --xl: 1.5rem; --small: 13px; --ink: #1f2328; --mute: #6a737d; --line: #d8dce0; --tint: #f3f4f6; --accent: #d7e9ff; --ok: #2f9e62; --warn: #8a5a00; --bad: #ad1b1b; --radius: 4px; }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: var(--l); color: var(--ink); background: #fff; }
  h2 { font-size: 16px; margin: 0 0 var(--s); }
  h3 { font-size: inherit; margin: var(--l) 0 var(--s); display: flex; justify-content: space-between; align-items: center; }
  h3 button { font-weight: normal; }
  ul { list-style: none; padding: 0; margin: 0; }
  [hidden] { display: none !important; }
  form { display: flex; gap: var(--m); margin: var(--m) 0; }
  input, button, select { min-width: 0; font: inherit; color: inherit; height: 2rem; padding: 0 var(--m); border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  input { flex: 1; min-width: 0; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=checkbox] { flex: none; height: auto; margin: 0; }
  button { cursor: pointer; background: var(--tint); white-space: nowrap; }
  button:hover { border-color: var(--mute); }
  .link, summary { font-weight: normal; height: auto; background: none; border: 0; padding: 0; color: var(--mute); font-size: var(--small); cursor: pointer; }
  .link:hover, summary:hover { color: var(--ink); }
  small, .mute, .id, .hint { color: var(--mute); }
  small, code, pre, .id, .chip, .hint, #memory ul { font-size: var(--small); }
  code, pre, .id, #memory ul { font-family: ui-monospace, monospace; }
  .dot { display: inline-block; width: var(--m); height: var(--m); border-radius: 50%; background: var(--line); margin-right: var(--m); }
  .dot.on { background: var(--ok); }
  .status { color: var(--warn); }
  .status.done { color: var(--ok); }
  .error { color: var(--bad); }
  .chip { background: var(--tint); color: var(--ink); border-radius: var(--radius); padding: 0 var(--s); margin-left: var(--s); text-decoration: none; }
  .chip.to { background: var(--accent); }
  pre { background: var(--ink); color: var(--tint); padding: var(--m); margin: var(--s) 0 0; border-radius: var(--radius); overflow-x: auto; white-space: pre-wrap; }
  pre.raw, .hint code { background: var(--tint); color: var(--ink); }
  .hint code { display: block; margin-top: var(--s); padding: var(--s) var(--m); border-radius: var(--radius); user-select: all; }

  #top { display: flex; align-items: center; gap: var(--l); }
  #top label { display: flex; align-items: center; gap: var(--m); }
  #me { flex: 0 0 9rem; }
  #layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: var(--xl); margin-top: var(--xl); }
  .server { margin-bottom: var(--xl); }
  .server header { display: flex; justify-content: space-between; align-items: baseline; }
  .server li { padding: var(--s) 0; }
  .server .thread-row { display: flex; padding: 0; }
  .thread { flex: 1; min-width: 0; height: auto; display: flex; align-items: baseline; gap: var(--m); text-align: left; background: none; border: 0; padding: var(--s) var(--m); margin-left: calc(-1 * var(--m)); }
  .thread span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread:hover, .thread.active { background: var(--tint); }
  .thread.active span { font-weight: 600; }
  .thread-row:not(:hover) .link { visibility: hidden; }
  #add summary { list-style: none; }
  #add summary::-webkit-details-marker { display: none; }

  #meta { margin-bottom: var(--l); }
  #entries li, #live li { border-bottom: 1px solid var(--line); padding: var(--m) 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  #entries li.agent, #live li.agent { border-left: 2px solid var(--accent); padding-left: var(--m); }
  #live li { opacity: .75; }
  #entries li.flash { outline: 2px solid #f0b400; }
  #memory { margin-bottom: var(--l); }
  #memory ul { padding-left: var(--l); }
  #memory li { cursor: pointer; white-space: pre-wrap; }
  /* One grid, so the fields line up: who, where and how hard, then what and send. */
  #composer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1fr) minmax(9rem, auto); gap: var(--m); margin-top: var(--l); }
  #body { grid-column: 1 / 4; }
  #more, .more { display: contents; }
  .more .link, #add-agent { justify-self: start; align-self: center; }
  #add-agent { grid-column: 1 / -1; }
  #composer .actions { display: flex; gap: var(--m); }
  #composer .actions button { flex: 1; }
  #composer .actions button:first-child { background: var(--ink); color: #fff; border-color: var(--ink); }
  @media (max-width: 760px) { #layout, #composer { grid-template-columns: minmax(0, 1fr); } #body { grid-column: auto; } }
</style>
<div id="top"><label>You are <input autocomplete="off" data-1p-ignore id="me" title="Your name, as ?user= in the URL"></label><label><input type="checkbox" id="structure">Show structure</label></div>
<div id="layout">
  <aside>
    <div id="servers"></div>
    <details id="add"><summary>+ add server</summary><form id="add-server"><input autocomplete="off" data-1p-ignore id="server-url" placeholder="http://localhost:3000" required><button>Add</button></form></details>
  </aside>
  <main>
    <h2 id="heading" hidden></h2>
    <div id="meta" class="mute"></div>
    <pre id="raw-thread" class="raw" hidden></pre>
    <details id="memory" hidden><summary></summary><ul></ul></details>
    <ul id="entries"></ul>
    <ul id="live"></ul>
    <form id="composer" hidden>
      <select id="runner" aria-label="Runner"></select>
      <select id="model" aria-label="Model"></select>
      <select id="effort" aria-label="Thinking"></select>
      <input autocomplete="off" data-1p-ignore id="dir" aria-label="Folder" placeholder="Folder (.)">
      <div id="more"></div>
      <button type="button" id="add-agent" class="link">+ agent</button>
      <input autocomplete="off" data-1p-ignore id="body" aria-label="Message" placeholder="Message, or $ command to run on the runner" required maxlength="10000">
      <div class="actions"><button>Send</button><button id="child" value="child">Send in a child thread</button></div>
    </form>
  </main>
</div>
<script type="module">
  const $ = (id) => document.getElementById(id);
  function build(tag, props, children = []) { const node = Object.assign(document.createElement(tag), props); node.append(...children); return node; }
  let me = new URLSearchParams(location.search).get('user') || 'anon';
  const STORE = 'agent-ide-servers';
  const ALIASES = 'agent-ide-aliases';
  const aliases = JSON.parse(localStorage.getItem(ALIASES) || '{}');
  const servers = new Map();
  let selected = null; // { url, id }; a null id is a draft thread, made by its first entry
  let view = null; // the thread's row in its server's list, set as it renders
  let entries = null; // its messages, from the thread's events
  const live = new Map(); // each agent's live work, from its conversation's events
  let retry = null; // the request ids of the send that failed last
  let structure = localStorage.getItem('agent-ide-structure') === '1';

  async function api(url, path, options = {}) {
    const response = await fetch(url + path, { ...options, headers: { 'x-user': me, ...options.headers } });
    const value = await response.json();
    if (!response.ok) throw new Error(value.error || `HTTP ${response.status}`);
    return value;
  }
  const post = (url, path, value) => api(url, path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(value) });
  const attempt = (promise) => promise.catch((error) => alert(error.message));

  function save() {
    localStorage.setItem(STORE, JSON.stringify([...servers.keys()]));
    localStorage.setItem(ALIASES, JSON.stringify(Object.fromEntries([...servers.values()].filter((s) => s.alias).map((s) => [s.url, s.alias]))));
  }

  function addServer(raw) {
    const url = new URL(raw).origin;
    if (!['http:', 'https:'].includes(new URL(url).protocol)) throw new Error('Use an http:// or https:// URL');
    if (servers.has(url)) return;
    servers.set(url, { url, alias: aliases[url] || '', status: 'connecting', info: null, threads: [], runners: [], socket: null, timer: null, refreshing: null });
    save();
    open(url);
    render();
  }

  function removeServer(url) {
    const server = servers.get(url);
    clearTimeout(server.timer);
    server.socket.onclose = null;
    server.socket.close();
    servers.delete(url);
    if (selected?.url === url) select(null);
    save();
    render();
  }

  function open(url) {
    const server = servers.get(url);
    const socket = new WebSocket(url.replace(/^http/, 'ws') + '/ws');
    server.socket = socket;
    // Watching again after a reconnect or a restart starts from fresh snapshots.
    socket.onopen = () => { server.status = 'online'; refresh(url); if (selected?.url === url) tell(url, selected.id); };
    socket.onmessage = ({ data }) => {
      const message = JSON.parse(data);
      if (message.events) return selected?.url === url && selected.id === message.thread && heard(message);
      server.refreshing ??= setTimeout(() => { server.refreshing = null; refresh(url); }, 300);
    };
    socket.onclose = () => {
      if (!servers.has(url)) return;
      server.status = 'offline';
      render();
      server.timer = setTimeout(() => open(url), 2000);
    };
    socket.onerror = () => socket.close();
  }

  async function refresh(url) {
    const server = servers.get(url);
    try {
      [server.info, server.threads, server.runners] = await Promise.all([api(url, '/api/server'), api(url, '/api/threads'), api(url, '/api/runners')]);
      if (selected?.url === url && selected.id && !server.threads.some((t) => t.id === selected.id)) select(null);
    } catch (error) { server.status = error.message; }
    render();
  }

  // The selected thread is watched: its server sends a snapshot, then events, for it and each of its agents.
  const tell = (url, id) => servers.get(url)?.socket?.readyState === WebSocket.OPEN && servers.get(url).socket.send(JSON.stringify({ watch: id ?? null }));
  function select(next) {
    if (selected && selected.url !== next?.url) tell(selected.url, null);
    selected = next;
    view = entries = memory = null;
    live.clear();
    opened.clear();
    zoomed.clear();
    $('runner').value = $('model').value = $('effort').value = $('dir').value = '';
    extra.splice(0).forEach((row) => row.node.remove());
    render();
    if (next) tell(next.url, next.id);
  }

  // What the thread's events change but don't carry: the read marker, the memory panel and opened conversations.
  async function reread() {
    const { url, id } = selected;
    post(url, `/api/threads/${id}/read`, {}).catch(() => {});
    memory = current()?.info?.modules.includes('memory') ? await api(url, `/api/threads/${id}/memory`) : null;
    for (const [at, value] of zoomed) zoomed.set(at, await api(url, `/api/threads/${id}/memory?zoom=${at}`).catch(() => value));
    for (const conversation of opened.keys()) opened.set(conversation, await api(url, `/api/conversations/${conversation}`));
    if (selected?.url === url && selected.id === id) renderThread();
  }

  // Pi's agent events: the thread's give its messages, an agent's its reply being written and this run's tool calls.
  function heard({ agent, events }) {
    let appended = false;
    for (const e of events) {
      if (agent) live.set(agent, step(live.get(agent) ?? { run: false, message: null, tools: [] }, e));
      else if (e.type === 'snapshot') entries = e.entries.filter((x) => x.kind === 'agent-ide.message'), appended = true;
      else if (e.type === 'entry_appended' && !entries.some((x) => x.id === e.entry.id)) {
        if (e.entry.kind === 'agent-ide.message') entries.push(e.entry);
        appended = true;
      }
    }
    if (agent) return renderLive();
    renderThread();
    if (appended && view) reread().catch(() => {});
  }

  function step(state, e) {
    const tool = (id, change) => {
      const old = state.tools.find((t) => t.callId === id) ?? { callId: id, name: e.toolName, output: '' };
      return { ...state, tools: [...state.tools.filter((t) => t !== old), { ...old, ...change }] };
    };
    switch (e.type) {
      case 'snapshot': return { run: Boolean(e.run), message: e.generation?.message ?? null, tools: e.tools.map((t) => ({ ...t, output: t.output ?? '' })) };
      case 'run_start': return { ...state, run: true };
      case 'run_end': return { run: false, message: null, tools: [] };
      case 'message_start': return e.message.role === 'assistant' ? { ...state, message: e.message } : state;
      case 'message_update': return state.message ? { ...state, message: e.changes.reduce(changed, structuredClone(state.message)) } : state;
      case 'message_end': return e.entry.model?.[0]?.role === 'assistant' ? { ...state, message: null } : state;
      case 'tool_execution_start': return tool(e.toolCallId, { args: e.args, status: 'running' });
      case 'tool_execution_update': {
        const was = state.tools.find((t) => t.callId === e.toolCallId)?.output ?? '';
        return e.output ? tool(e.toolCallId, { output: 'set' in e.output ? e.output.set : was.slice(e.output.trimStart ?? 0) + (e.output.append ?? '') }) : state;
      }
      case 'tool_execution_end': return tool(e.toolCallId, { status: 'done' });
      default: return state;
    }
  }

  // One change to the reply being written, as Pi's MessageChange.
  function changed(message, c) {
    const blocks = message.content;
    if (c.type === 'message') return structuredClone(c.message);
    if (c.type.endsWith('_start')) blocks.splice(c.contentIndex, 0, structuredClone(c.block));
    else if (c.type === 'block') blocks[c.contentIndex] = structuredClone(c.block);
    else if (c.type === 'text_delta') blocks[c.contentIndex].text += c.delta;
    else if (c.type === 'thinking_delta') blocks[c.contentIndex].thinking += c.delta;
    else if (c.type === 'toolcall_delta') {
      let at = blocks[c.contentIndex].arguments;
      for (const key of c.path.slice(0, -1)) at = at[key];
      at[c.path.at(-1)] = (at[c.path.at(-1)] ?? '') + c.delta;
    }
    return message;
  }

  const current = () => selected && servers.get(selected.url);

  function render() {
    $('servers').replaceChildren(...[...servers.values()].map(serverView));
    if (!servers.size) $('servers').replaceChildren(build('p', { className: 'mute', textContent: 'No servers yet. Start one with `bun server.js` and add its URL below.' }));
    renderThread();
  }

  const raw = (value) => structure ? build('pre', { className: 'raw', textContent: JSON.stringify(value, null, 2) }) : '';

  function serverView(server) {
    const { info } = server;
    const host = server.url.replace(/^https?:\/\//, '');
    return build('section', { className: 'server' }, [
      build('header', {}, [
        build('span', {}, [build('span', { className: `dot ${server.status === 'online' ? 'on' : ''}` }), build('b', { textContent: server.alias || host }),
          server.alias ? build('small', { textContent: ` ${host}` }) : '',
          ' ', build('button', { className: 'link', textContent: 'alias…', onclick: () => {
            const alias = prompt(`Alias for ${server.url} (empty to clear)`, server.alias);
            if (alias === null) return;
            server.alias = alias.trim();
            save();
            render();
          } })]),
        build('button', { className: 'link', textContent: '×', title: 'Remove server', onclick: () => removeServer(server.url) }),
      ]),
      server.status === 'online' ? '' : build('div', { className: 'error', textContent: server.status }),
      info ? build('small', { textContent: `${info.file} · ${info.threads} threads` }) : '',
      raw(info),
      build('h3', { textContent: 'Runners' }),
      build('ul', {}, server.runners.length ? server.runners.map((runner) => runnerView(server, runner))
        : [build('li', { className: 'hint' }, [`None yet. From agent-ide on ${/^https?:\/\/(localhost|127\.|\[::1\])/.test(server.url) ? 'this machine' : 'a machine that can reach this address'}:`, build('code', { textContent: `bun runner.js --server ${server.url} --dir ~/code` })])]),
      build('h3', {}, ['Threads', build('button', { textContent: 'New thread', onclick: () => select({ url: server.url, id: null }) })]),
      build('ul', {}, server.threads.length ? nested(server.threads).map(({ thread, depth }) => build('li', { className: 'thread-row', style: `margin-left: ${depth}rem` }, [build('button', {
        className: `thread ${selected?.url === server.url && selected.id === thread.id ? 'active' : ''}`,
        onclick: () => select({ url: server.url, id: thread.id }),
      }, [build('span', { textContent: (depth ? '↳ ' : '') + thread.title }), statusView(thread), build('small', { className: 'mute', textContent: when(thread.createdAt) })]), build('button', {
        className: 'link', textContent: '×', title: `Hide thread: ${thread.title}`, ariaLabel: `Hide thread: ${thread.title}`,
        onclick: () => attempt(api(server.url, `/api/threads/${thread.id}`, { method: 'DELETE' }).then(() => refresh(server.url))),
      })])) : [build('li', { className: 'hint', textContent: 'None yet.' })]),
    ]);
  }

  function runnerView(server, runner) {
    const threads = server.threads.filter((t) => t.agents.some((a) => a.status !== 'idle' && a.to?.runner === runner.name));
    return build('li', {}, [
      build('span', { className: `dot ${runner.online ? 'on' : ''}` }), runner.name, ' ',
      build('small', { textContent: `${runner.alias ? `${runner.alias} · ` : ''}${runner.owner ? `${runner.owner}'s · ` : ''}${runner.dir} · ${runner.model || 'no default model'}` }),
      ...threads.map((t) => build('div', {}, [build('small', { className: 'status' }, [`${t.status} in `, threadLink(server, t.id)])])),
      ...runner.calls.map((c) => build('div', {}, [build('small', { className: 'mute', textContent: `${c.op} ${c.what}` })])),
      raw(runner),
    ]);
  }

  // A thread's start, as a time today or a date before, so two threads with one title can be told apart.
  const when = (iso) => { const d = new Date(iso); return d.toDateString() === new Date().toDateString() ? d.toTimeString().slice(0, 5) : d.toISOString().slice(0, 10); };

  function statusView(thread) {
    const busy = thread.agents.filter((a) => a.status !== 'idle').map((a) => a.name).join(', ');
    const text = { working: `${busy || 'shell'} working`, blocked: `${busy} waits for its runner`, done: 'done', error: 'failed' }[thread.status];
    return text ? build('small', { className: `status ${thread.status}` }, [text]) : '';
  }

  const agentName = (to) => to && `${to.model}@${to.runner}`;
  const toLabel = (to) => [agentName(to), to.effort, to.dir && `in ${to.dir}`].filter(Boolean).join(' · ');

  function threadLink(server, id) {
    const title = server.threads.find((t) => t.id === Number(id))?.title || `#${id}`;
    return build('a', { href: '#', textContent: title, onclick: (event) => { event.preventDefault(); select({ url: server.url, id: Number(id) }); } });
  }

  function renderThread() {
    const server = current();
    const draft = selected && !selected.id;
    view = (selected?.id && server?.threads.find((t) => t.id === selected.id)) || null;
    const fork = view?.conversation?.parent;
    $('heading').textContent = draft ? 'New thread' : view?.title || '';
    $('heading').hidden = !$('heading').textContent;
    $('meta').replaceChildren(...(view ? [
      structure ? build('span', { className: 'id', textContent: `thread ${view.id} ` }) : '', view.status,
      view.parent ? build('span', {}, [' · child of ', threadLink(server, view.parent)]) : '',
      fork ? build('span', {}, [' · forked from ', threadLink(server, fork.conversationId), ` at message ${position(fork.at)}`]) : '',
      ['working', 'blocked'].includes(view.status) ? build('button', { className: 'link', textContent: 'stop', onclick: () => attempt(post(server.url, `/api/threads/${view.id}/stop`, {})) }) : '',
      build('ul', {}, view.agents.map(agentView)),
    ] : []));
    $('raw-thread').hidden = !structure || !view;
    $('raw-thread').textContent = view ? JSON.stringify(view, null, 2) : '';
    $('composer').hidden = !(draft || view);
    renderEntries();
    renderLive();
    renderMemory();
    renderPicker();
  }

  // The thread's memory, each line over the messages it covers: a click zooms a line into the two it was made from, or its message whole.
  let memory = null;
  const zoomed = new Map();
  function renderMemory() {
    $('memory').hidden = !view || !memory || !entries;
    if ($('memory').hidden) return;
    const lineView = ({ id, n, text }) => {
      const at = `${id},${n}`;
      const shown = zoomed.get(at);
      return build('li', { onclick: (event) => attempt((async () => {
        event.stopPropagation();
        if (shown) zoomed.delete(at);
        else zoomed.set(at, await api(selected.url, `/api/threads/${view.id}/memory?zoom=${at}`));
        renderMemory();
      })()) }, [build('u', { textContent: n === 1 ? `${id + 1}` : `${id + 1}–${id + n}` }), ` ${text}`,
        shown?.lines ? build('ul', {}, shown.lines.map(lineView)) : '',
        shown?.message ? build('pre', { textContent: shown.message }) : '']);
    };
    $('memory').querySelector('summary').textContent = `Memory · ${memory.lines.length} lines over ${entries?.length ?? 0} messages`;
    $('memory').querySelector('ul').replaceChildren(...memory.lines.map(lineView));
  }

  // A message's number for people: its place in the thread, from 1, which memory's lines count in too.
  const position = (entryId) => (entries ?? []).findIndex((e) => e.id === entryId) + 1 || '?';

  // Each agent's own Pi conversation, shown raw in the structure view.
  const opened = new Map();
  function agentView(agent) {
    const shown = opened.get(agent.conversation);
    return build('li', {}, [
      build('b', { textContent: agent.name }), ` ${agent.status} `,
      structure ? build('button', { className: 'link', textContent: `${shown ? 'hide' : 'show'} conversation #${agent.conversation}`, onclick: () => attempt((async () => {
        if (shown) opened.delete(agent.conversation);
        else opened.set(agent.conversation, await api(selected.url, `/api/conversations/${agent.conversation}`));
        renderThread();
      })()) }) : '',
      shown && structure ? raw(shown) : '',
    ]);
  }


  function renderEntries() {
    const server = current();
    if (!view || !entries) return $('entries').replaceChildren();
    $('entries').replaceChildren(...entries.map((entry) => {
      const m = entry.data;
      return build('li', { id: `e-${entry.id}`, className: m.error ? 'error' : m.answer ? 'agent' : '' }, [
        build('b', { textContent: m.author }), ' ', build('span', { className: 'id', textContent: `${position(entry.id)}` }),
        m.from ? build('span', { className: 'chip' }, [m.re ? '↩ answers in ' : 'from ', threadLink(server, m.from)]) : '',
        m.to ? build('span', { className: 'chip to', textContent: `→ ${m.to.map(toLabel).join(', ')}` }) : '',
        ...(m.from ? [] : m.re ?? []).map((n) => build('a', { href: '#', className: 'chip', textContent: `↩ ${position(n)}`, title: 'A message this answers', onclick: (event) => { event.preventDefault(); flash(n); } })),
        m.answer && structure ? build('span', { className: 'chip', textContent: `conversation ${m.answer.conversation} at entry ${m.answer.entry}` }) : '',
        build('button', { className: 'link', textContent: 'fork', title: 'A new thread with everything up to here', onclick: () => attempt(forkAt(server.url, entry.id)) }),
        build('div', {}, linked(server, m.body)),
        m.shell ? build('pre', { textContent: `exit ${m.shell.code ?? m.shell.error} on ${m.shell.runner}\n${[m.shell.stdout, m.shell.stderr].filter(Boolean).join('\n')}` }) : '',
        raw(entry),
      ]);
    }));
  }

  // Each working agent's reply as it is written and its tool calls as they start and end, then running commands.
  function renderLive() {
    if (!view) return $('live').replaceChildren();
    const working = view.agents.filter((a) => a.status !== 'idle' || live.get(a.name)?.run);
    $('live').replaceChildren(...working.map((a) => {
      const { message, tools = [] } = live.get(a.name) ?? {};
      const blocks = message?.content ?? [];
      return build('li', { className: 'agent' }, [
        build('b', { textContent: a.name }), ' ', build('small', { className: 'status', textContent: a.status === 'blocked' ? `waits for ${a.to?.runner}, which is offline…` : 'working…' }),
        ...tools.map((t) => build('div', {}, [build('small', { className: 'mute', textContent: `${t.status === 'done' ? '✓' : '…'} ${t.name} ${JSON.stringify(t.args ?? {})}` }),
          t.output ? build('pre', { textContent: t.output.slice(-2000) }) : ''])),
        ...blocks.map((b) => b.type === 'text' ? build('div', { textContent: b.text }) : b.type === 'thinking' ? build('div', { className: 'mute', textContent: b.thinking })
          : b.type === 'toolCall' ? build('small', { className: 'mute', textContent: `→ ${b.name} ${JSON.stringify(b.arguments ?? {})}` }) : ''),
      ]);
    }),
    ...view.shells.map((run) => build('li', {}, [
      build('b', { textContent: run.author }), ' ', build('small', { className: 'status', textContent: `running on ${run.to.runner}` }),
      build('pre', { textContent: `$ ${run.command}\n${run.stdout}${run.stderr}` }),
    ])));
  }

  async function forkAt(url, at) {
    const { id } = await post(url, `/api/threads/${view.id}/fork`, { at });
    await refresh(url);
    select({ url, id });
  }

  function flash(id) {
    const node = $(`e-${id}`);
    if (!node) return;
    node.scrollIntoView({ block: 'center', behavior: 'smooth' });
    node.classList.add('flash');
    setTimeout(() => node.classList.remove('flash'), 1200);
  }

  // Who answers: one row per agent, each a runner, one of its models and how hard it thinks.
  // The first row alone can keep the thread's last pick or name nobody; more rows each add an agent.
  const EFFORTS = ['off', 'minimal', 'low', 'medium', 'high', 'xhigh', 'max'];
  const first = { runner: $('runner'), model: $('model'), effort: $('effort') };
  const extra = [];
  function fill(select, options) {
    const value = select.value;
    select.replaceChildren(...options.map(([v, label]) => build('option', { value: v, textContent: label })));
    select.value = options.some(([v]) => v === value) ? value : options[0]?.[0] ?? '';
  }
  function fillRow(row, server, runners) {
    fill(row.runner, runners);
    const runner = server.runners.find((r) => r.name === row.runner.value);
    fill(row.model, runner ? [['', `Default model${runner.model ? ` (${runner.model})` : ''}`], ...[...new Set([...runner.offers, ...runner.models, 'echo/echo'])].map((m) => [m, m])] : [['', '—']]);
    fill(row.effort, runner ? [['', 'Default thinking'], ...EFFORTS.map((e) => [e, `Thinking: ${e}`])] : [['', '—']]);
    row.model.disabled = row.effort.disabled = !runner;
    return runner;
  }
  function renderPicker() {
    const server = current();
    if (!server) return;
    const last = entries?.findLast((e) => e.data.to)?.data.to.map(agentName).join(', ');
    const fallback = server.info?.modules.includes('director') ? 'Director decides' : last && `Same as last: ${last}`;
    const runners = server.runners.map((r) => [r.name, r.online ? r.name : `${r.name} (offline)`]);
    const named = fillRow(first, server, [...(fallback ? [['', fallback]] : []), ...runners, ['nobody', 'Nobody']]);
    if (!named) extra.splice(0).forEach((row) => row.node.remove());
    for (const row of extra) fillRow(row, server, runners);
    $('dir').disabled = !named;
    $('add-agent').hidden = !named;
    $('child').hidden = !selected?.id;
  }
  $('runner').onchange = renderPicker;
  $('add-agent').onclick = () => {
    const row = { runner: build('select', { ariaLabel: 'Runner', onchange: renderPicker }), model: build('select', { ariaLabel: 'Model' }), effort: build('select', { ariaLabel: 'Thinking' }) };
    row.node = build('div', { className: 'more' }, [row.runner, row.model, row.effort, build('button', { type: 'button', className: 'link', textContent: 'remove', onclick: () => {
      extra.splice(extra.indexOf(row), 1);
      row.node.remove();
    } })]);
    extra.push(row);
    $('more').append(row.node);
    renderPicker();
  };

  // The rows as the API's `to`: undefined keeps the last pick, null is nobody.
  function pickedTo() {
    if (!first.runner.value) return undefined;
    if (first.runner.value === 'nobody') return null;
    return [first, ...extra].map((row) => ({ runner: row.runner.value, model: row.model.value, effort: row.effort.value, dir: $('dir').value }));
  }

  // A child whose parent is hidden sits at the top.
  function nested(threads, parent = null, depth = 0) {
    const ids = new Set(threads.map((t) => t.id));
    return threads.filter((t) => (ids.has(t.parent) ? t.parent : null) === parent).flatMap((thread) => [{ thread, depth }, ...nested(threads, thread.id, depth + 1)]);
  }

  function linked(server, body) {
    return body.split(/(thread:\d+)/).map((part) => part.startsWith('thread:') ? threadLink(server, part.slice(7)) : part);
  }

  $('composer').onsubmit = (event) => {
    event.preventDefault();
    const body = $('body').value;
    const { url, id } = selected;
    const child = Boolean(id) && event.submitter?.value === 'child';
    const to = pickedTo();
    const entry = to === undefined ? { body } : { body, to };
    // A send that failed keeps its request ids, so sending the same text again lands once.
    const key = JSON.stringify([url, id, child, entry]);
    const ids = retry?.key === key ? retry.ids : { thread: crypto.randomUUID(), entry: crypto.randomUUID() };
    $('body').value = '';
    attempt((async () => {
      try {
        const threadId = id && !child ? id : (await post(url, '/api/threads', { title: body.slice(0, 60), parent: id, requestId: ids.thread })).id;
        await post(url, `/api/threads/${threadId}/entries`, { ...entry, requestId: ids.entry });
        retry = null;
        if (threadId !== id) { await refresh(url); select({ url, id: threadId }); }
      } catch (error) {
        retry = { key, ids };
        $('body').value ||= body;
        throw error;
      }
    })());
  };
  $('add-server').onsubmit = (event) => {
    event.preventDefault();
    try { addServer($('server-url').value); $('server-url').value = ''; } catch (error) { alert(error.message); }
  };
  $('structure').checked = structure;
  $('structure').onchange = () => {
    structure = $('structure').checked;
    localStorage.setItem('agent-ide-structure', structure ? '1' : '');
    render();
  };

  $('me').value = me;
  $('me').onchange = () => {
    me = $('me').value.trim() || 'anon';
    const url = new URL(location.href);
    url.searchParams.set('user', me);
    history.replaceState(null, '', url);
  };
  const saved = JSON.parse(localStorage.getItem(STORE) || '[]');
  for (const url of saved) addServer(url);
  render();
  $('add').open = !saved.length;
  // Served by an agent-ide server rather than a dev server? Add it.
  if (!saved.length) fetch('/api/server').then((r) => r.headers.get('content-type')?.includes('json') && (addServer(location.origin), $('add').open = false)).catch(() => {});
</script>
</html>
