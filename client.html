<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-ide</title>
<style>
  body { font: 15px system-ui, sans-serif; max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem; color: #20242a; }
  h1 { margin: 0 0 .25rem; font-size: 1.3rem; }
  h2 { font-size: 1rem; margin: 0; }
  form { display: flex; gap: .4rem; margin: .5rem 0; }
  input, button, select { font: inherit; padding: .4rem; }
  input { flex: 1; min-width: 0; }
  button { cursor: pointer; }
  ul { list-style: none; padding: 0; margin: .25rem 0; }
  [hidden] { display: none !important; }
  small, .mute { color: #59636e; }
  .error { color: #ad1b1b; }
  #layout { display: grid; grid-template-columns: 300px 1fr; gap: 1.5rem; margin-top: 1rem; }
  .server { border: 1px solid #ddd; border-radius: 8px; padding: .6rem; margin-bottom: .8rem; }
  .server header { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  .server header button { padding: .1rem .4rem; }
  .thread { width: 100%; text-align: left; margin-bottom: .25rem; }
  .thread.active { background: #d7e9ff; }
  .dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: #bbb; margin-right: .3rem; }
  .dot.on { background: #2f9e62; }
  #placement { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin: .5rem 0; }
  #messages li { border-bottom: 1px solid #eee; padding: .5rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  #messages li.bot { background: #f6f3fb; padding-left: .5rem; }
  #messages b { font-weight: 600; }
  #messages li.system { color: #ad1b1b; font-style: italic; }
  #messages pre { background: #20242a; color: #e7e9ee; padding: .5rem; margin: .3rem 0 0; overflow-x: auto; font-size: 13px; }
  @media (max-width: 700px) { #layout { grid-template-columns: 1fr; } }
</style>
<h1>agent-ide</h1>
<div class="mute">You are <b id="me"></b>. Set <code>?user=name</code> in the URL to be someone else.</div>
<form id="add-server"><input id="server-url" placeholder="Add a server, e.g. http://localhost:3000" required><button>Add</button></form>
<div id="layout">
  <aside id="servers"></aside>
  <main>
    <h2 id="heading">Select a thread</h2>
    <div id="placement" hidden>
      Replies from
      <select id="runner"></select>
      <select id="harness"></select>
      <input id="model" placeholder="model (optional)" style="flex:0 1 11rem">
    </div>
    <ul id="messages"></ul>
    <form id="post" hidden><input id="body" placeholder="Message, or $ command to run on the runner" required maxlength="10000"><button>Send</button></form>
  </main>
</div>
<script type="module">
  const $ = (id) => document.getElementById(id);
  function build(tag, props, children = []) { const node = Object.assign(document.createElement(tag), props); node.append(...children); return node; }
  const me = new URLSearchParams(location.search).get('user') || 'anon';
  const STORE = 'agent-ide-servers';
  // Every server is its own world: its own threads, runners and socket.
  const servers = new Map();
  let selected = null; // { url, id }
  let messages = [];

  async function api(url, path, options) {
    const response = await fetch(url + path, options);
    const value = await response.json();
    if (!response.ok) throw new Error(value.error || `HTTP ${response.status}`);
    return value;
  }
  const post = (url, path, value) => api(url, path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-user': me }, body: JSON.stringify(value) });

  function save() { localStorage.setItem(STORE, JSON.stringify([...servers.keys()])); }

  function addServer(raw) {
    const url = new URL(raw).origin;
    if (!['http:', 'https:'].includes(new URL(url).protocol)) throw new Error('Use an http:// or https:// URL');
    if (servers.has(url)) return;
    servers.set(url, { url, status: 'connecting', threads: [], runners: [], socket: null, timer: null });
    save();
    open(url);
    render();
  }

  function removeServer(url) {
    const server = servers.get(url);
    clearTimeout(server.timer);
    server.socket.onclose = null;
    server.socket.close();
    servers.delete(url);
    if (selected?.url === url) select(null);
    save();
    render();
  }

  function open(url) {
    const server = servers.get(url);
    const socket = new WebSocket(url.replace(/^http/, 'ws') + '/ws');
    server.socket = socket;
    socket.onopen = () => { server.status = 'online'; refresh(url); };
    socket.onmessage = ({ data }) => {
      const { threadId } = JSON.parse(data);
      if (threadId === null) refresh(url);
      else if (selected?.url === url && selected.id === threadId) loadMessages();
    };
    socket.onclose = () => {
      if (!servers.has(url)) return;
      server.status = 'offline';
      render();
      server.timer = setTimeout(() => open(url), 2000);
    };
    socket.onerror = () => socket.close();
  }

  async function refresh(url) {
    const server = servers.get(url);
    try {
      [server.threads, server.runners] = await Promise.all([api(url, '/api/threads'), api(url, '/api/runners')]);
    } catch (error) { server.status = error.message; }
    render();
  }

  function select(next) {
    selected = next;
    messages = [];
    render();
    loadMessages();
  }

  async function loadMessages() {
    if (!selected) return;
    const { url, id } = selected;
    const loaded = await api(url, `/api/threads/${id}/events`);
    if (selected?.url === url && selected.id === id) { messages = loaded; renderMessages(); }
  }

  function render() {
    $('servers').replaceChildren(...[...servers.values()].map((server) => {
      const newThread = build('form', { onsubmit: async (event) => {
        event.preventDefault();
        const title = event.target.elements.title.value;
        const thread = await post(server.url, '/api/threads', { title });
        await refresh(server.url);
        select({ url: server.url, id: thread.id });
      } }, [build('input', { name: 'title', placeholder: 'New thread', required: true }), build('button', { textContent: '+' })]);
      return build('section', { className: 'server' }, [
        build('header', {}, [
          build('span', {}, [build('span', { className: `dot ${server.status === 'online' ? 'on' : ''}` }), build('b', { textContent: server.url.replace(/^https?:\/\//, '') })]),
          build('button', { textContent: '×', title: 'Remove server', onclick: () => removeServer(server.url) }),
        ]),
        server.status === 'online' ? '' : build('div', { className: 'error', textContent: server.status }),
        build('small', { textContent: 'Runners' }),
        build('ul', {}, server.runners.length ? server.runners.map((runner) => build('li', {}, [
          build('span', { className: `dot ${runner.online ? 'on' : ''}` }), `${runner.name} `, build('small', { textContent: runner.harnesses.join(', ') }),
        ])) : [build('li', { className: 'mute', textContent: 'none — start runner.js' })]),
        build('small', { textContent: 'Threads' }),
        build('ul', {}, nested(server.threads).map(({ thread, depth }) => build('li', { style: `margin-left: ${depth * 1}rem` }, [build('button', {
          className: `thread ${selected?.url === server.url && selected.id === thread.id ? 'active' : ''}`,
          textContent: (depth ? '↳ ' : '') + thread.title + (thread.runner ? ` · ${thread.runner}` : ''),
          onclick: () => select({ url: server.url, id: thread.id }),
        })]))),
        newThread,
      ]);
    }));
    if (!servers.size) $('servers').replaceChildren(build('p', { className: 'mute', textContent: 'No servers yet. Start one with `bun server.js` and add its URL above.' }));
    renderPlacement();
    renderMessages();
  }

  function current() {
    const server = selected && servers.get(selected.url);
    return server && { server, thread: server.threads.find((t) => t.id === selected.id) };
  }

  function renderPlacement() {
    const found = current();
    $('heading').textContent = found?.thread?.title || 'Select a thread';
    $('placement').hidden = !found?.thread;
    $('post').hidden = !found?.thread;
    if (!found?.thread) return;
    const { server, thread } = found;
    if (document.activeElement === $('model')) return;
    const runner = server.runners.find((r) => r.name === thread.runner);
    $('runner').replaceChildren(build('option', { value: '', textContent: 'nobody (humans only)' }),
      ...server.runners.map((r) => build('option', { value: r.name, textContent: r.name + (r.online ? '' : ' (offline)') })));
    if (thread.runner && !runner) $('runner').append(build('option', { value: thread.runner, textContent: `${thread.runner} (unknown)` }));
    $('runner').value = thread.runner || '';
    const harnesses = runner?.harnesses || (thread.harness ? [thread.harness] : []);
    $('harness').replaceChildren(...harnesses.map((h) => build('option', { value: h, textContent: h })));
    $('harness').hidden = !thread.runner;
    $('harness').value = thread.harness || harnesses[0] || '';
    $('model').hidden = !thread.runner || $('harness').value === 'echo';
    $('model').value = thread.model || '';
  }

  async function place() {
    const { server, thread } = current();
    const runnerName = $('runner').value;
    const runner = server.runners.find((r) => r.name === runnerName);
    const harness = runner?.harnesses.includes($('harness').value) ? $('harness').value : runner?.harnesses[0];
    await post(server.url, `/api/threads/${thread.id}`, { runner: runnerName, harness, model: $('model').value });
  }
  $('runner').onchange = place;
  $('harness').onchange = place;
  $('model').onchange = place;

  function renderMessages() {
    $('messages').replaceChildren(...messages.map((m) => build('li', { className: `${m.kind} ${m.type}` }, [
      build('b', { textContent: m.author }), ' ', build('small', { textContent: (m.runner ? `via ${m.runner} · ` : '') + new Date(m.createdAt).toLocaleTimeString() }),
      m.type === 'exec' ? execView(JSON.parse(m.body)) : build('div', {}, linked(m.body)),
    ])));
  }

  // Children sit under their parent.
  function nested(threads, parent = null, depth = 0) {
    return threads.filter((t) => (t.parent || null) === parent).flatMap((thread) => [{ thread, depth }, ...nested(threads, thread.id, depth + 1)]);
  }

  // "thread:<id>" in a message becomes a link to that thread on the same server.
  function linked(body) {
    return body.split(/(thread:[\w-]+)/).map((part) => {
      const id = part.startsWith('thread:') && part.slice(7);
      if (!id) return part;
      const title = servers.get(selected.url)?.threads.find((t) => t.id === id)?.title || id.slice(0, 8);
      return build('a', { href: '#', textContent: `↳ ${title}`, onclick: (event) => { event.preventDefault(); select({ url: selected.url, id }); } });
    });
  }

  function execView({ command, dir, code, stdout, stderr }) {
    return build('pre', { textContent: `$ ${command}   (in ${dir}, exit ${code})\n${[stdout, stderr].filter(Boolean).join('\n')}` });
  }

  $('post').onsubmit = async (event) => {
    event.preventDefault();
    const body = $('body').value;
    $('body').value = '';
    // "$ cmd" runs cmd on the thread's runner instead of posting a message.
    const command = body.match(/^\$\s+(.+)/s)?.[1];
    try {
      if (command) await post(selected.url, `/api/threads/${selected.id}/exec`, { runner: current().thread.runner, command });
      else await post(selected.url, `/api/threads/${selected.id}/events`, { author: me, kind: 'human', body });
    } catch (error) { alert(error.message); }
  };
  $('add-server').onsubmit = (event) => {
    event.preventDefault();
    try { addServer($('server-url').value); $('server-url').value = ''; } catch (error) { alert(error.message); }
  };

  $('me').textContent = me;
  const saved = JSON.parse(localStorage.getItem(STORE) || '[]');
  for (const url of saved) addServer(url);
  render();
  // Served by an arbe server rather than a file or a dev server? Add it.
  if (!saved.length) fetch('/api/runners').then((r) => r.headers.get('content-type')?.includes('json') && addServer(location.origin)).catch(() => {});
</script>
</html>
