<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-ide</title>
<style>
  body { font: 15px system-ui, sans-serif; max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; color: #20242a; }
  h2 { font-size: 1rem; margin: 0; }
  form { display: flex; gap: .4rem; margin: .5rem 0; }
  input, button, select { font: inherit; padding: .4rem; }
  input { flex: 1; min-width: 0; }
  button { cursor: pointer; }
  ul { list-style: none; padding: 0; margin: .25rem 0; }
  [hidden] { display: none !important; }
  small, .mute { color: #59636e; }
  code, .id { font: 12px ui-monospace, monospace; }
  .id { color: #8a8f98; }
  #layout { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; margin-top: 1rem; }
  .server { border: 1px solid #ddd; border-radius: 8px; padding: .6rem; margin-bottom: .8rem; }
  .server header { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  .server h3 { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: #59636e; margin: .8rem 0 .2rem; display: flex; justify-content: space-between; }
  .thread-row { display: flex; gap: .25rem; margin-bottom: .25rem; }
  .thread { flex: 1; min-width: 0; text-align: left; }
  .thread.active { background: #d7e9ff; }
  .dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: #bbb; margin-right: .3rem; }
  .dot.on { background: #2f9e62; }
  .status { color: #8a5a00; }
  .status.done { color: #2f9e62; }
  .status.error { color: #ad1b1b; }
  .error { color: #ad1b1b; }
  .link { background: none; border: 0; padding: 0 .2rem; color: #59636e; }
  .chip { font-size: 12px; background: #eef1f5; color: #20242a; border-radius: 4px; padding: 0 .35rem; margin-left: .35rem; text-decoration: none; }
  .chip.to { background: #e3eeff; }
  #entries li { border-bottom: 1px solid #eee; padding: .5rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  #entries li.agent { background: #f6f3fb; padding-left: .5rem; }
  #entries li.note { color: #59636e; font-style: italic; }
  #entries li.error { color: #ad1b1b; }
  #entries li.live { opacity: .75; }
  #entries li.flash { outline: 2px solid #f0b400; }
  #entries b { font-weight: 600; }
  pre { background: #20242a; color: #e7e9ee; padding: .5rem; margin: .3rem 0 0; overflow-x: auto; font-size: 13px; white-space: pre-wrap; }
  pre.raw { background: #f4f5f7; color: #3a3f47; font-size: 12px; }
  #composer { flex-direction: column; border-top: 1px solid #ddd; padding-top: .5rem; }
  #composer .row { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  #composer .row input:not(#body) { flex: 0 1 9rem; }
  @media (max-width: 760px) { #layout { grid-template-columns: 1fr; } }
</style>
<div class="mute">You are <b id="me"></b>. Set <code>?user=name</code> in the URL to be someone else. <label><input type="checkbox" id="structure"> Show structure</label></div>
<form id="add-server"><input id="server-url" placeholder="Add a server, e.g. http://localhost:3000" required><button>Add</button></form>
<div id="layout">
  <aside id="servers"></aside>
  <main>
    <h2 id="heading">Pick a thread, or start one</h2>
    <div id="meta" class="mute"></div>
    <pre id="raw-thread" class="raw" hidden></pre>
    <ul id="entries"></ul>
    <div id="pending"></div>
    <!-- Posting is the one verb. The `to` says who should answer; nobody means it's for the humans here. -->
    <form id="composer" hidden>
      <div class="row">
        <small>To</small>
        <select id="runner" title="Runner"></select>
        <select id="harness" title="Harness"></select>
        <input id="model" placeholder="model (default)">
        <select id="effort" title="Effort"></select>
        <input id="dir" placeholder="folder (.)">
        <label id="child-label"><input type="checkbox" id="child"> in a child thread</label>
      </div>
      <div class="row"><input id="body" required maxlength="10000"><button>Send</button></div>
    </form>
  </main>
</div>
<script type="module">
  const $ = (id) => document.getElementById(id);
  function build(tag, props, children = []) { const node = Object.assign(document.createElement(tag), props); node.append(...children); return node; }
  const me = new URLSearchParams(location.search).get('user') || 'anon';
  const STORE = 'agent-ide-servers';
  // Each client names the servers it knows; the URL stays the key.
  const ALIASES = 'agent-ide-aliases';
  const aliases = JSON.parse(localStorage.getItem(ALIASES) || '{}');
  const EFFORTS = ['low', 'medium', 'high', 'xhigh', 'max'];
  // Every server is its own world: its own threads, runners and socket.
  const servers = new Map();
  let selected = null; // { url, id }; an id of null is a new thread, made by its first entry
  let entries = [];
  // Which thread the `to` picker was last filled for, so it's filled once per thread and then left to you.
  let pickedFor = null;
  let structure = localStorage.getItem('agent-ide-structure') === '1';

  // Every request says who you are; a thread's status depends on it.
  async function api(url, path, options = {}) {
    const response = await fetch(url + path, { ...options, headers: { 'x-user': me, ...options.headers } });
    const value = await response.json();
    if (!response.ok) throw new Error(value.error || `HTTP ${response.status}`);
    return value;
  }
  const post = (url, path, value) => api(url, path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(value) });
  const remove = (url, path) => api(url, path, { method: 'DELETE' });
  const attempt = (promise) => promise.catch((error) => alert(error.message));
  const short = (id) => id.slice(0, 6);

  function save() {
    localStorage.setItem(STORE, JSON.stringify([...servers.keys()]));
    localStorage.setItem(ALIASES, JSON.stringify(Object.fromEntries([...servers.values()].filter((s) => s.alias).map((s) => [s.url, s.alias]))));
  }

  function addServer(raw) {
    const url = new URL(raw).origin;
    if (!['http:', 'https:'].includes(new URL(url).protocol)) throw new Error('Use an http:// or https:// URL');
    if (servers.has(url)) return;
    servers.set(url, { url, alias: aliases[url] || '', status: 'connecting', info: null, threads: [], runners: [], socket: null, timer: null });
    save();
    open(url);
    render();
  }

  function removeServer(url) {
    const server = servers.get(url);
    clearTimeout(server.timer);
    server.socket.onclose = null;
    server.socket.close();
    servers.delete(url);
    if (selected?.url === url) select(null);
    save();
    render();
  }

  function open(url) {
    const server = servers.get(url);
    const socket = new WebSocket(url.replace(/^http/, 'ws') + '/ws');
    server.socket = socket;
    socket.onopen = () => { server.status = 'online'; refresh(url); };
    socket.onmessage = ({ data }) => {
      const { threadId, live } = JSON.parse(data);
      // An answer in progress replaces its previous frame; the finished answer arrives as an entry, and a refresh drops it.
      if (live) {
        const thread = server.threads.find((t) => t.id === threadId);
        if (thread) thread.live = [...thread.live.filter((l) => l.entryId !== live.entryId), live];
        if (selected?.url === url && selected.id === threadId) renderEntries();
      } else if (threadId === null) refresh(url);
      else if (selected?.url === url && selected.id === threadId) loadEntries();
    };
    socket.onclose = () => {
      if (!servers.has(url)) return;
      server.status = 'offline';
      render();
      server.timer = setTimeout(() => open(url), 2000);
    };
    socket.onerror = () => socket.close();
  }

  async function refresh(url) {
    const server = servers.get(url);
    try {
      [server.info, server.threads, server.runners] = await Promise.all([api(url, '/api/server'), api(url, '/api/threads'), api(url, '/api/runners')]);
      if (selected?.url === url && selected.id && !server.threads.some((t) => t.id === selected.id)) select(null);
      else if (selected?.url === url) markRead();
    } catch (error) { server.status = error.message; }
    render();
  }

  function select(next) {
    selected = next;
    entries = [];
    render();
    loadEntries();
  }

  async function loadEntries() {
    if (!selected?.id) return;
    const { url, id } = selected;
    try {
      const loaded = await api(url, `/api/threads/${id}/entries`);
      if (selected?.url !== url || selected.id !== id) return;
      entries = loaded;
      markRead();
      if (pickedFor !== id) { pickedFor = id; setPicker(defaultTo()); }
      renderThread();
    } catch (error) {
      await refresh(url);
      if (selected?.url === url && selected.id === id) alert(error.message);
    }
  }

  function current() {
    const server = selected && servers.get(selected.url);
    return server && { server, thread: server.threads.find((t) => t.id === selected.id) };
  }

  // Looking at a thread means you've seen its last result, so it stops showing as done.
  function markRead() {
    const { server, thread } = current() || {};
    if (!thread) return;
    post(server.url, `/api/threads/${thread.id}/read`, {}).catch(() => {});
    if (thread.status === 'done') { thread.status = 'idle'; render(); }
  }

  // Alone, a thread answers whoever it last asked. With a director, entries go to nobody unless you say otherwise.
  function defaultTo() {
    const { server } = current() || {};
    if (server?.info?.director) return null;
    return entries.findLast((e) => e.to && e.to.harness !== 'shell')?.to ?? null;
  }

  function render() {
    $('servers').replaceChildren(...[...servers.values()].map(serverView));
    if (!servers.size) $('servers').replaceChildren(build('p', { className: 'mute', textContent: 'No servers yet. Start one with `bun server.js` and add its URL above.' }));
    renderThread();
  }

  const raw = (value) => structure ? build('pre', { className: 'raw', textContent: JSON.stringify(value, null, 2) }) : '';

  // A server: its options, its runners and what each is answering, and its threads with their status.
  function serverView(server) {
    const { info } = server;
    return build('section', { className: 'server' }, [
      build('header', {}, [
        build('span', {}, [build('span', { className: `dot ${server.status === 'online' ? 'on' : ''}` }), build('b', { textContent: server.alias || server.url.replace(/^https?:\/\//, '') }),
          server.alias ? build('small', { textContent: ` ${server.url.replace(/^https?:\/\//, '')}` }) : '',
          build('button', { className: 'link', textContent: 'alias…', onclick: () => {
            const alias = prompt(`Alias for ${server.url} (empty to clear)`, server.alias);
            if (alias === null) return;
            server.alias = alias.trim();
            save();
            render();
          } })]),
        build('button', { textContent: '×', title: 'Remove server', onclick: () => removeServer(server.url) }),
      ]),
      server.status === 'online' ? '' : build('div', { className: 'error', textContent: server.status }),
      info ? build('small', { textContent: `director ${info.director ? 'on' : 'off'} · ${info.threads} threads · ${info.owed} waiting for an answer` }) : '',
      raw(info),
      build('h3', { textContent: 'Runners' }),
      build('ul', {}, server.runners.length ? server.runners.map((runner) => runnerView(server, runner))
        : [build('li', { className: 'mute', textContent: 'none: start runner.js' })]),
      build('h3', {}, ['Threads', build('button', { className: 'link', textContent: '+ new', onclick: () => select({ url: server.url, id: null }) })]),
      build('ul', {}, nested(server.threads).map(({ thread, depth }) => build('li', { className: 'thread-row', style: `margin-left: ${depth}rem` }, [build('button', {
        className: `thread ${selected?.url === server.url && selected.id === thread.id ? 'active' : ''}`,
        onclick: () => select({ url: server.url, id: thread.id }),
      }, [(depth ? '↳ ' : '') + thread.title, statusView(server, thread)]), build('button', {
        textContent: '×', title: `Delete thread: ${thread.title}`, ariaLabel: `Delete thread: ${thread.title}`,
        onclick: () => attempt(remove(server.url, `/api/threads/${thread.id}`).then(() => refresh(server.url))),
      })]))),
    ]);
  }

  // A runner: whose machine it is, its harnesses, and the entries it is answering right now.
  function runnerView(server, runner) {
    return build('li', {}, [
      build('span', { className: `dot ${runner.online ? 'on' : ''}` }), runner.alias || runner.name, ' ',
      build('small', { textContent: `${runner.alias ? `${runner.name} · ` : ''}${runner.owner}'s · ${runner.harnesses.join(', ')}` }),
      ...runner.working.map((w) => build('div', {}, [build('small', { className: 'status' }, ['answering ', threadLink(server, w.threadId), ` #${short(w.entryId)}`])])),
      raw(runner),
    ]);
  }

  // A thread's status, said briefly: who is working, which runner it's queued for, or that a result is done or failed.
  function statusView(server, thread) {
    const pending = (state) => thread.pending.filter((p) => p.state === state);
    const text = {
      working: [` · ${[...new Set(pending('working').map((p) => agentLabel(server, p.to)))].join(', ')} working`],
      queued: [` · queued for ${[...new Set(pending('queued').map((p) => runnerName(server, p.to.runner)))].join(', ')}`],
      done: [' · done'],
      error: [' · failed'],
    }[thread.status];
    return text ? build('small', { className: `status ${thread.status}` }, text) : '';
  }

  const runnerName = (server, name) => server.runners.find((r) => r.name === name)?.alias || name;
  const agentLabel = (server, to) => `${to.harness}@${runnerName(server, to.runner)}`;
  const toLabel = (server, to) => [agentLabel(server, to), to.model, to.effort, to.dir && `in ${to.dir}`].filter(Boolean).join(' · ');

  function threadLink(server, id) {
    const title = server.threads.find((t) => t.id === id)?.title || short(id);
    return build('a', { href: '#', textContent: title, onclick: (event) => { event.preventDefault(); select({ url: server.url, id }); } });
  }

  // The main pane: the thread, its entries, what's still waiting for an answer, and the composer.
  function renderThread() {
    const { server, thread } = current() || {};
    const draft = selected && !selected.id;
    $('heading').textContent = draft ? 'New thread' : thread?.title || 'Pick a thread, or start one';
    $('meta').replaceChildren(...(thread ? [
      build('span', { className: 'id', textContent: `#${short(thread.id)} ` }), thread.status,
      thread.parent ? build('span', {}, [' · child of ', threadLink(server, thread.parent)]) : '',
    ] : draft ? ['Your first entry starts it.'] : []));
    $('raw-thread').hidden = !structure || !thread;
    $('raw-thread').textContent = thread ? JSON.stringify(thread, null, 2) : '';
    $('composer').hidden = !(draft || thread);
    renderEntries();
    renderPicker();
  }

  function renderEntries() {
    const { server, thread } = current() || {};
    if (!thread) { $('entries').replaceChildren(); $('pending').replaceChildren(); return; }
    $('entries').replaceChildren(...entries.map((e) => build('li', { id: `e-${e.id}`, className: `${e.role} ${e.kind}` }, [
      build('b', { textContent: e.author }), ' ', build('small', { textContent: new Date(e.createdAt).toLocaleTimeString() }),
      build('span', { className: 'id', textContent: ` #${short(e.id)}` }),
      e.to ? build('span', { className: 'chip to', textContent: `→ ${toLabel(server, e.to)}` }) : '',
      e.replyTo ? build('a', { href: '#', className: 'chip', textContent: `↩ #${short(e.replyTo)}`, title: 'The entry this answers', onclick: (event) => { event.preventDefault(); flash(e.replyTo); } }) : '',
      stepsView(e.steps, false),
      e.kind === 'exec' ? execView(JSON.parse(e.body)) : e.to?.harness === 'shell' ? build('pre', { textContent: `$ ${e.body}` }) : build('div', {}, linked(server, e.body)),
      raw(e),
    ])), ...thread.live.map((l) => build('li', { className: 'agent live' }, [
      build('b', { textContent: l.author }), ' ', build('small', { className: 'status', textContent: 'writing…' }),
      build('a', { href: '#', className: 'chip', textContent: `↩ #${short(l.entryId)}`, onclick: (event) => { event.preventDefault(); flash(l.entryId); } }),
      stepsView(l.steps, true),
      build('div', { textContent: l.text }),
    ])));
    $('pending').replaceChildren(...thread.pending.map((p) => build('div', { className: 'status' }, [
      build('small', {}, [`#${short(p.id)} waits for ${agentLabel(server, p.to)}: ${p.state}`]),
      p.state === 'queued' ? build('button', { className: 'link', textContent: 'cancel', onclick: () => attempt(post(server.url, `/api/entries/${p.id}/cancel`, {})) }) : '',
    ])));
  }

  function flash(id) {
    const node = $(`e-${id}`);
    if (!node) return;
    node.scrollIntoView({ block: 'center', behavior: 'smooth' });
    node.classList.add('flash');
    setTimeout(() => node.classList.remove('flash'), 1200);
  }

  // The `to` picker: a runner (or nobody), one of its harnesses, and optional model, effort and folder.
  function renderPicker() {
    const { server } = current() || {};
    if (!server) return;
    keep($('runner'), [['', 'nobody'], ...server.runners.map((r) => [r.name, `${r.alias || r.name}${r.online ? '' : ' (offline)'}`])]);
    const runner = server.runners.find((r) => r.name === $('runner').value);
    keep($('harness'), (runner?.harnesses || []).map((h) => [h, h]));
    keep($('effort'), [['', 'effort (default)'], ...EFFORTS.map((e) => [e, e])]);
    const nobody = !$('runner').value;
    for (const id of ['harness', 'model', 'effort', 'dir']) $(id).disabled = nobody;
    $('child-label').hidden = !selected?.id;
    $('body').placeholder = nobody
      ? `An entry for the humans here${server.info?.director ? '; @agent calls one in' : ''}`
      : `An entry for ${$('harness').value}@${runnerName(server, $('runner').value)}; $ command runs in its shell`;
  }
  $('runner').onchange = $('harness').onchange = renderPicker;

  function setPicker(to) {
    if (!to) return void ($('runner').value = '', renderPicker());
    keep($('runner'), [[to.runner, to.runner]], to.runner);
    $('runner').value = to.runner;
    renderPicker();
    keep($('harness'), [[to.harness, to.harness]], to.harness);
    $('harness').value = to.harness;
    $('model').value = to.model || '';
    $('effort').value = to.effort || '';
    $('dir').value = to.dir || '';
    renderPicker();
  }

  // Options are rebuilt on refresh. A select keeps its value, and `wanted` stays an option even when it isn't connected.
  function keep(select, options, wanted = select.value) {
    if (document.activeElement === select) return;
    if (wanted && !options.some(([v]) => v === wanted)) options = [[wanted, `${wanted} (not connected)`], ...options];
    select.replaceChildren(...options.map(([v, text]) => build('option', { value: v, textContent: text })));
    if (options.some(([v]) => v === wanted)) select.value = wanted;
  }

  // Children sit under their parent.
  function nested(threads, parent = null, depth = 0) {
    return threads.filter((t) => (t.parent || null) === parent).flatMap((thread) => [{ thread, depth }, ...nested(threads, thread.id, depth + 1)]);
  }

  // "thread:<id>" in an entry becomes a link to that thread on the same server.
  function linked(server, body) {
    return body.split(/(thread:[\w-]+)/).map((part) => part.startsWith('thread:') ? threadLink(server, part.slice(7)) : part);
  }

  // The tool calls an answer made: open while it works, folded once it's done.
  function stepsView(steps, open) {
    if (!steps?.length) return '';
    return build('details', { open }, [
      build('summary', { className: 'mute', textContent: `${steps.length} step${steps.length === 1 ? '' : 's'}` }),
      ...steps.map((step) => build('pre', { textContent: `${step.name}: ${step.args}${step.status === 'done' ? '' : ` (${step.status})`}${step.output ? `\n${step.output}` : ''}` })),
    ]);
  }

  function execView({ code, stdout, stderr }) {
    return build('pre', { textContent: `exit ${code}\n${[stdout, stderr].filter(Boolean).join('\n')}` });
  }

  // Posting is the one verb. "$ cmd" goes to the picked runner's shell. A child thread hands work off and reports back here.
  $('composer').onsubmit = (event) => {
    event.preventDefault();
    const text = $('body').value;
    const command = text.match(/^\$\s+(.+)/s)?.[1];
    const runner = $('runner').value;
    if (command && !runner) return alert('Pick a runner to run the command on');
    const to = !runner ? null : command ? { runner, harness: 'shell', dir: $('dir').value } : { runner, harness: $('harness').value, model: $('model').value, effort: $('effort').value, dir: $('dir').value };
    const body = command || text;
    const { url, id } = selected;
    const child = Boolean(id) && $('child').checked;
    $('body').value = '';
    attempt((async () => {
      const threadId = id && !child ? id : (await post(url, '/api/threads', { title: body.slice(0, 60), parent: id })).id;
      await post(url, `/api/threads/${threadId}/entries`, { body, to });
      if (child) await post(url, `/api/threads/${id}/entries`, { body: `Handed off → thread:${threadId}` });
      if (!id) { await refresh(url); select({ url, id: threadId }); }
    })());
  };
  $('add-server').onsubmit = (event) => {
    event.preventDefault();
    try { addServer($('server-url').value); $('server-url').value = ''; } catch (error) { alert(error.message); }
  };
  $('structure').checked = structure;
  $('structure').onchange = () => {
    structure = $('structure').checked;
    localStorage.setItem('agent-ide-structure', structure ? '1' : '');
    render();
  };

  $('me').textContent = me;
  const saved = JSON.parse(localStorage.getItem(STORE) || '[]');
  for (const url of saved) addServer(url);
  render();
  // Served by an agent-ide server rather than a file or a dev server? Add it.
  if (!saved.length) fetch('/api/server').then((r) => r.headers.get('content-type')?.includes('json') && addServer(location.origin)).catch(() => {});
</script>
</html>
