<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-ide</title>
<style>
  body { font: 15px system-ui, sans-serif; max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; color: #20242a; }
  h2 { font-size: 1rem; margin: 0; }
  form { display: flex; gap: .4rem; margin: .5rem 0; }
  input, button, select { font: inherit; padding: .4rem; }
  input { flex: 1; min-width: 0; }
  button { cursor: pointer; }
  ul { list-style: none; padding: 0; margin: .25rem 0; }
  [hidden] { display: none !important; }
  small, .mute { color: #59636e; }
  code, .id { font: 12px ui-monospace, monospace; }
  .id { color: #8a8f98; }
  #layout { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; margin-top: 1rem; }
  .server { border: 1px solid #ddd; border-radius: 8px; padding: .6rem; margin-bottom: .8rem; }
  .server header { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  .server h3 { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: #59636e; margin: .8rem 0 .2rem; display: flex; justify-content: space-between; }
  .thread-row { display: flex; gap: .25rem; margin-bottom: .25rem; }
  .thread { flex: 1; min-width: 0; text-align: left; }
  .thread.active { background: #d7e9ff; }
  .dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: #bbb; margin-right: .3rem; }
  .dot.on { background: #2f9e62; }
  .status { color: #8a5a00; }
  .status.done { color: #2f9e62; }
  .status.failed { color: #ad1b1b; }
  .error { color: #ad1b1b; }
  .link { background: none; border: 0; padding: 0 .2rem; color: #59636e; }
  .chip { font-size: 12px; background: #eef1f5; color: #20242a; border-radius: 4px; padding: 0 .35rem; margin-left: .35rem; text-decoration: none; }
  .chip.to { background: #e3eeff; }
  #entries li { border-bottom: 1px solid #eee; padding: .5rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  #entries li.agent { background: #f6f3fb; padding-left: .5rem; }
  #entries li.quiet { color: #59636e; font-size: 13px; }
  #entries li.note { color: #59636e; font-style: italic; }
  #entries li.error { color: #ad1b1b; }
  #entries li.live { opacity: .75; }
  #entries li.flash { outline: 2px solid #f0b400; }
  #entries b { font-weight: 600; }
  pre { background: #20242a; color: #e7e9ee; padding: .5rem; margin: .3rem 0 0; overflow-x: auto; font-size: 13px; white-space: pre-wrap; }
  pre.raw { background: #f4f5f7; color: #3a3f47; font-size: 12px; }
  #composer { flex-direction: column; border-top: 1px solid #ddd; padding-top: .5rem; }
  #composer .row { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  #composer .row input:not(#body) { flex: 0 1 9rem; }
  @media (max-width: 760px) { #layout { grid-template-columns: 1fr; } }
</style>
<div class="mute">You are <b id="me"></b>. Set <code>?user=name</code> in the URL to be someone else. <label><input type="checkbox" id="structure"> Show structure</label></div>
<form id="add-server"><input id="server-url" placeholder="Add a server, e.g. http://localhost:3000" required><button>Add</button></form>
<div id="layout">
  <aside id="servers"></aside>
  <main>
    <h2 id="heading">Pick a thread, or start one</h2>
    <div id="meta" class="mute"></div>
    <pre id="raw-thread" class="raw" hidden></pre>
    <ul id="entries"></ul>
    <!-- Posting is the one verb. Default lets the server pick who answers; nobody means it's for the humans here. -->
    <form id="composer" hidden>
      <div class="row">
        <small>To</small>
        <select id="runner" title="Runner"></select>
        <input id="model" list="models" placeholder="model (runner's default)">
        <datalist id="models"></datalist>
        <select id="effort" title="Effort"></select>
        <input id="dir" placeholder="folder (.)">
        <label id="child-label"><input type="checkbox" id="child"> in a child thread</label>
      </div>
      <div class="row"><input id="body" required maxlength="10000"><button>Send</button></div>
    </form>
  </main>
</div>
<script type="module">
  const $ = (id) => document.getElementById(id);
  function build(tag, props, children = []) { const node = Object.assign(document.createElement(tag), props); node.append(...children); return node; }
  const me = new URLSearchParams(location.search).get('user') || 'anon';
  const STORE = 'agent-ide-servers';
  // Each client names the servers it knows; the URL stays the key.
  const ALIASES = 'agent-ide-aliases';
  const aliases = JSON.parse(localStorage.getItem(ALIASES) || '{}');
  // Pi's thinking levels.
  const EFFORTS = ['off', 'minimal', 'low', 'medium', 'high', 'xhigh', 'max'];
  // Every server is its own world: its own threads, runners and socket.
  const servers = new Map();
  let selected = null; // { url, id }; an id of null is a new thread, made by its first entry
  let view = null; // the selected thread as the server shows it: row, Pi's docs, entries
  let structure = localStorage.getItem('agent-ide-structure') === '1';

  // Every request says who you are; a thread's status depends on it.
  async function api(url, path, options = {}) {
    const response = await fetch(url + path, { ...options, headers: { 'x-user': me, ...options.headers } });
    const value = await response.json();
    if (!response.ok) throw new Error(value.error || `HTTP ${response.status}`);
    return value;
  }
  const post = (url, path, value) => api(url, path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(value) });
  const remove = (url, path) => api(url, path, { method: 'DELETE' });
  const attempt = (promise) => promise.catch((error) => alert(error.message));

  function save() {
    localStorage.setItem(STORE, JSON.stringify([...servers.keys()]));
    localStorage.setItem(ALIASES, JSON.stringify(Object.fromEntries([...servers.values()].filter((s) => s.alias).map((s) => [s.url, s.alias]))));
  }

  function addServer(raw) {
    const url = new URL(raw).origin;
    if (!['http:', 'https:'].includes(new URL(url).protocol)) throw new Error('Use an http:// or https:// URL');
    if (servers.has(url)) return;
    servers.set(url, { url, alias: aliases[url] || '', status: 'connecting', info: null, threads: [], runners: [], socket: null, timer: null, refreshing: null });
    save();
    open(url);
    render();
  }

  function removeServer(url) {
    const server = servers.get(url);
    clearTimeout(server.timer);
    server.socket.onclose = null;
    server.socket.close();
    servers.delete(url);
    if (selected?.url === url) select(null);
    save();
    render();
  }

  // The server says which thread changed; the open one reloads, and the lists catch up.
  function open(url) {
    const server = servers.get(url);
    const socket = new WebSocket(url.replace(/^http/, 'ws') + '/ws');
    server.socket = socket;
    socket.onopen = () => { server.status = 'online'; refresh(url); };
    socket.onmessage = ({ data }) => {
      const { threadId } = JSON.parse(data);
      if (selected?.url === url && selected.id === threadId) loadThread();
      server.refreshing ??= setTimeout(() => { server.refreshing = null; refresh(url); }, 300);
    };
    socket.onclose = () => {
      if (!servers.has(url)) return;
      server.status = 'offline';
      render();
      server.timer = setTimeout(() => open(url), 2000);
    };
    socket.onerror = () => socket.close();
  }

  async function refresh(url) {
    const server = servers.get(url);
    try {
      [server.info, server.threads, server.runners] = await Promise.all([api(url, '/api/server'), api(url, '/api/threads'), api(url, '/api/runners')]);
      if (selected?.url === url && selected.id && !server.threads.some((t) => t.id === selected.id)) select(null);
    } catch (error) { server.status = error.message; }
    render();
  }

  function select(next) {
    selected = next;
    view = null;
    render();
    loadThread();
  }

  // Loading a thread reads it: its last result stops counting as done for you.
  async function loadThread() {
    if (!selected?.id) return;
    const { url, id } = selected;
    try {
      const loaded = await api(url, `/api/threads/${id}`);
      if (selected?.url !== url || selected.id !== id) return;
      const first = !view;
      view = loaded;
      post(url, `/api/threads/${id}/read`, {}).catch(() => {});
      if (first) setPicker();
      renderThread();
    } catch (error) {
      await refresh(url);
      if (selected?.url === url && selected.id === id) alert(error.message);
    }
  }

  const current = () => selected && servers.get(selected.url);

  function render() {
    $('servers').replaceChildren(...[...servers.values()].map(serverView));
    if (!servers.size) $('servers').replaceChildren(build('p', { className: 'mute', textContent: 'No servers yet. Start one with `bun server.js` and add its URL above.' }));
    renderThread();
  }

  const raw = (value) => structure ? build('pre', { className: 'raw', textContent: JSON.stringify(value, null, 2) }) : '';

  // A server: its options, its runners and what each is doing, and its threads with their status.
  function serverView(server) {
    const { info } = server;
    return build('section', { className: 'server' }, [
      build('header', {}, [
        build('span', {}, [build('span', { className: `dot ${server.status === 'online' ? 'on' : ''}` }), build('b', { textContent: server.alias || server.url.replace(/^https?:\/\//, '') }),
          server.alias ? build('small', { textContent: ` ${server.url.replace(/^https?:\/\//, '')}` }) : '',
          build('button', { className: 'link', textContent: 'alias…', onclick: () => {
            const alias = prompt(`Alias for ${server.url} (empty to clear)`, server.alias);
            if (alias === null) return;
            server.alias = alias.trim();
            save();
            render();
          } })]),
        build('button', { textContent: '×', title: 'Remove server', onclick: () => removeServer(server.url) }),
      ]),
      server.status === 'online' ? '' : build('div', { className: 'error', textContent: server.status }),
      info ? build('small', { textContent: `${info.file} · director ${info.director ? 'on' : 'off'} · ${info.threads} threads · Pi ${info.work.scheduling}, ${info.work.tasks.length} live tasks, ${info.work.submissions.length} open submissions` }) : '',
      raw(info),
      build('h3', { textContent: 'Runners' }),
      build('ul', {}, server.runners.length ? server.runners.map((runner) => runnerView(server, runner))
        : [build('li', { className: 'mute', textContent: 'none: start runner.js' })]),
      build('h3', {}, ['Threads', build('button', { className: 'link', textContent: '+ new', onclick: () => select({ url: server.url, id: null }) })]),
      build('ul', {}, nested(server.threads).map(({ thread, depth }) => build('li', { className: 'thread-row', style: `margin-left: ${depth}rem` }, [build('button', {
        className: `thread ${selected?.url === server.url && selected.id === thread.id ? 'active' : ''}`,
        onclick: () => select({ url: server.url, id: thread.id }),
      }, [(depth ? '↳ ' : '') + thread.title, statusView(thread)]), build('button', {
        textContent: '×', title: `Hide thread: ${thread.title}`, ariaLabel: `Hide thread: ${thread.title}`,
        onclick: () => attempt(remove(server.url, `/api/threads/${thread.id}`).then(() => refresh(server.url))),
      })]))),
    ]);
  }

  // A runner: whose machine and folder it is, its default model, and what the server has asked of it right now.
  function runnerView(server, runner) {
    const threads = server.threads.filter((t) => ['working', 'queued'].includes(t.status) && t.agent?.runner === runner.name);
    return build('li', {}, [
      build('span', { className: `dot ${runner.online ? 'on' : ''}` }), runner.name, ' ',
      build('small', { textContent: `${runner.alias ? `${runner.alias} · ` : ''}${runner.owner}'s · ${runner.dir} · ${runner.model || 'no default model'}` }),
      ...threads.map((t) => build('div', {}, [build('small', { className: 'status' }, [`${t.status} in `, threadLink(server, t.id)])])),
      ...runner.calls.map((c) => build('div', {}, [build('small', { className: 'mute', textContent: `${c.op} ${c.what}` })])),
      raw(runner),
    ]);
  }

  function statusView(thread) {
    const agent = agentName(thread.agent);
    const text = { working: ` · ${agent || 'shell'} working`, queued: ` · ${agent} waits for its runner`, done: ' · done', failed: ' · failed' }[thread.status];
    return text ? build('small', { className: `status ${thread.status}` }, [text]) : '';
  }

  // An agent is a model on a runner, named like gpt-6.1-sol@laptop.
  const agentName = (to) => to && `${to.model.split('/').pop()}@${to.runner}`;
  const toLabel = (to) => [agentName(to), to.effort, to.dir && `in ${to.dir}`].filter(Boolean).join(' · ');

  function threadLink(server, id) {
    const title = server.threads.find((t) => t.id === Number(id))?.title || `#${id}`;
    return build('a', { href: '#', textContent: title, onclick: (event) => { event.preventDefault(); select({ url: server.url, id: Number(id) }); } });
  }

  // The main pane: the thread, its entries, what Pi is doing in it right now, and the composer.
  function renderThread() {
    const server = current();
    const draft = selected && !selected.id;
    // Where a fork came from is Pi's own record of the conversation.
    const fork = view?.conversation?.parent;
    $('heading').textContent = draft ? 'New thread' : view?.title || 'Pick a thread, or start one';
    $('meta').replaceChildren(...(view ? [
      build('span', { className: 'id', textContent: `#${view.id} ` }), view.status, view.agent ? ` · agent ${toLabel(view.agent)}` : '',
      view.parent ? build('span', {}, [' · child of ', threadLink(server, view.parent)]) : '',
      fork ? build('span', {}, [' · forked from ', threadLink(server, fork.conversationId), ` at #${fork.at}`]) : '',
      ['working', 'queued'].includes(view.status) ? build('button', { className: 'link', textContent: 'stop', onclick: () => attempt(post(server.url, `/api/threads/${view.id}/stop`, {})) }) : '',
    ] : draft ? ['Your first entry starts it.'] : []));
    const { entries, ...row } = view || {};
    $('raw-thread').hidden = !structure || !view;
    $('raw-thread').textContent = view ? JSON.stringify(row, null, 2) : '';
    $('composer').hidden = !(draft || view);
    renderEntries();
    renderPicker();
  }

  const textOf = (content) => typeof content === 'string' ? content : (content ?? []).filter((p) => p.type === 'text').map((p) => p.text).join('');

  // One entry, by kind. pi.* are Pi's own; agent-ide.* are ours.
  function entryBody(server, { body, entry }) {
    const message = entry.model?.[0];
    switch (entry.kind) {
      case 'pi.user': return ['', body ?? textOf(message.content)];
      case 'pi.assistant': return ['agent', [
        ...message.content.filter((p) => p.type === 'thinking' && p.thinking).map((p) => build('details', {}, [build('summary', { className: 'mute', textContent: 'thinking' }), p.thinking])),
        textOf(message.content),
        ...message.content.filter((p) => p.type === 'toolCall').map((p) => build('pre', { textContent: `${p.name} ${JSON.stringify(p.arguments)}` })),
        ['stop', 'toolUse'].includes(message.stopReason) ? '' : build('div', { className: 'error', textContent: `${message.stopReason}${message.errorMessage ? `: ${message.errorMessage}` : ''}` }),
      ]];
      case 'pi.tool-result': return ['agent', [build('details', {}, [build('summary', { className: message.isError ? 'error' : 'mute', textContent: `${message.toolName} result${message.isError ? ' (error)' : ''}` }), build('pre', { textContent: textOf(message.content) })])]];
      case 'pi.system': return ['quiet', ['system prompt or tools changed']];
      case 'agent-ide.chat': return ['', entry.data.body];
      case 'agent-ide.shell': return ['', [build('pre', { textContent: `$ ${entry.data.command}\nexit ${entry.data.code ?? entry.data.error}\n${[entry.data.stdout, entry.data.stderr].filter(Boolean).join('\n')}` })]];
      case 'agent-ide.note': return ['note', linked(server, entry.data.text)];
      case 'agent-ide.error': return ['error', entry.data.text];
      default: return ['quiet', [entry.kind]];
    }
  }

  function renderEntries() {
    const server = current();
    if (!view) return $('entries').replaceChildren();
    const live = view.docs['pi.live'] ?? {};
    const inbox = view.docs['pi.inbox']?.items ?? [];
    $('entries').replaceChildren(...view.entries.map((item) => {
      const [className, body] = entryBody(server, item);
      return build('li', { id: `e-${item.entry.id}`, className }, [
        build('b', { textContent: item.author }), ' ', build('span', { className: 'id', textContent: `#${item.entry.id} ${item.entry.kind}` }),
        // An input written in another thread: where it came from, and the post it answers there, if it's an answer.
        item.from ? build('span', { className: 'chip' }, [item.re ? `↩ answers #${item.re} in ` : 'from ', threadLink(server, item.from)]) : '',
        item.to ? build('span', { className: 'chip to', textContent: `→ ${toLabel(item.to)}` }) : '',
        ...item.replyTo.map((input) => build('a', { href: '#', className: 'chip', textContent: `↩ #${input}`, title: 'An input this answers', onclick: (event) => { event.preventDefault(); flash(input); } })),
        build('button', { className: 'link', textContent: 'fork', title: 'A new thread with everything up to here', onclick: () => attempt(forkAt(server.url, item.entry.id)) }),
        build('div', {}, [body].flat()),
        raw(item),
      ]);
    }),
    // What Pi is doing right now, straight from pi.live: the answer being written, a retry's backoff, running tools.
    ...(live.generation ? [build('li', { className: 'agent live' }, [
      build('b', { textContent: agentName(view.agent) }), ' ',
      build('small', { className: 'status', textContent: live.generation.retry ? `retrying after: ${live.generation.retry.error}` : view.status === 'queued' ? 'waits for its runner…' : `writing… attempt ${live.generation.attempt}` }),
      build('div', { textContent: textOf(live.generation.message?.content) }),
    ])] : []),
    ...(live.tools ?? []).filter((slot) => slot.status !== 'done').map((slot) => build('li', { className: 'agent live' }, [
      build('b', { textContent: agentName(view.agent) }), ' ', build('small', { className: 'status', textContent: `${slot.name} ${slot.status}` }),
      build('pre', { textContent: slot.output || '…' }),
    ])),
    ...view.shells.map((run) => build('li', { className: 'live' }, [
      build('b', { textContent: run.author }), ' ', build('small', { className: 'status', textContent: `running on ${run.to.runner}` }),
      build('pre', { textContent: `$ ${run.command}\n${run.stdout}${run.stderr}` }),
    ])),
    // Inputs and writes Pi holds until the current run reaches a boundary.
    ...inbox.map((item) => build('li', { className: 'quiet' }, [`queued ${item.mode}: `, item.mode === 'write' ? item.entry.kind : textOf(item.content)])));
  }

  async function forkAt(url, at) {
    const { id } = await post(url, `/api/threads/${view.id}/fork`, { at });
    await refresh(url);
    select({ url, id });
  }

  function flash(id) {
    const node = $(`e-${id}`);
    if (!node) return;
    node.scrollIntoView({ block: 'center', behavior: 'smooth' });
    node.classList.add('flash');
    setTimeout(() => node.classList.remove('flash'), 1200);
  }

  // The `to` picker. Default leaves it to the server: the thread's last agent, or the director. Nobody means no answer.
  function renderPicker() {
    const server = current();
    if (!server) return;
    const fallback = server.info?.director ? 'the director decides' : agentName(view?.agent) || 'nobody yet';
    keep($('runner'), [['', `default (${fallback})`], ['-', 'nobody'], ...server.runners.map((r) => [r.name, `${r.name}${r.online ? '' : ' (offline)'}`])]);
    const runner = server.runners.find((r) => r.name === $('runner').value);
    keep($('effort'), [['', 'effort (default)'], ...EFFORTS.map((e) => [e, e])]);
    // Any model in pi's catalog works, as provider/model; echo/echo answers at once, for testing.
    $('models').replaceChildren(...[runner?.model, 'echo/echo'].filter(Boolean).map((value) => build('option', { value })));
    $('model').placeholder = runner?.model || 'model';
    for (const id of ['model', 'effort', 'dir']) $(id).disabled = !runner;
    $('child-label').hidden = !selected?.id;
    const model = ($('model').value || runner?.model || '').split('/').pop();
    $('body').placeholder = !runner ? ($('runner').value === '-' ? 'An entry for the humans here' : `An entry for ${fallback}; $ command runs on its runner`)
      : `An entry for ${model}@${runner.name}; $ command runs in its folder`;
  }
  $('runner').onchange = $('model').oninput = renderPicker;

  // A thread opens with the picker on default; you change it, and it stays as you left it.
  function setPicker() {
    $('runner').value = '';
    $('model').value = $('dir').value = '';
    renderPicker();
  }

  // Options are rebuilt on refresh. A select keeps its value.
  function keep(select, options, wanted = select.value) {
    if (document.activeElement === select) return;
    select.replaceChildren(...options.map(([v, text]) => build('option', { value: v, textContent: text })));
    if (options.some(([v]) => v === wanted)) select.value = wanted;
  }

  // Children sit under their parent; a child whose parent is hidden sits at the top.
  function nested(threads, parent = null, depth = 0) {
    const ids = new Set(threads.map((t) => t.id));
    return threads.filter((t) => (ids.has(t.parent) ? t.parent : null) === parent).flatMap((thread) => [{ thread, depth }, ...nested(threads, thread.id, depth + 1)]);
  }

  // "thread:<id>" in an entry becomes a link to that thread on the same server.
  function linked(server, body) {
    return body.split(/(thread:\d+)/).map((part) => part.startsWith('thread:') ? threadLink(server, part.slice(7)) : part);
  }

  // Posting is the one verb. A child thread hands work off; the server notes it in the parent and reports answers back.
  $('composer').onsubmit = (event) => {
    event.preventDefault();
    const body = $('body').value;
    const runner = $('runner').value;
    const entry = runner === '' ? { body } : runner === '-' ? { body, to: null }
      : { body, to: { runner, model: $('model').value, effort: $('effort').value, dir: $('dir').value } };
    const { url, id } = selected;
    const child = Boolean(id) && $('child').checked;
    $('body').value = '';
    attempt((async () => {
      const threadId = id && !child ? id : (await post(url, '/api/threads', { title: body.slice(0, 60), parent: id })).id;
      await post(url, `/api/threads/${threadId}/entries`, entry);
      if (threadId !== id) { await refresh(url); select({ url, id: threadId }); }
    })());
  };
  $('add-server').onsubmit = (event) => {
    event.preventDefault();
    try { addServer($('server-url').value); $('server-url').value = ''; } catch (error) { alert(error.message); }
  };
  $('structure').checked = structure;
  $('structure').onchange = () => {
    structure = $('structure').checked;
    localStorage.setItem('agent-ide-structure', structure ? '1' : '');
    render();
  };

  $('me').textContent = me;
  const saved = JSON.parse(localStorage.getItem(STORE) || '[]');
  for (const url of saved) addServer(url);
  render();
  // Served by an agent-ide server rather than a file or a dev server? Add it.
  if (!saved.length) fetch('/api/server').then((r) => r.headers.get('content-type')?.includes('json') && addServer(location.origin)).catch(() => {});
</script>
</html>
