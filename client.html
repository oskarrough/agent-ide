<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realtime threads POC</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 850px; margin: 2rem auto; padding: 0 1rem; color: #20242a; }
  h1 { margin-bottom: .25rem; }
  form { display: flex; gap: .5rem; margin: 1rem 0; }
  input, button { font: inherit; padding: .55rem; }
  input { flex: 1; min-width: 0; }
  button { cursor: pointer; }
  #layout { display: grid; grid-template-columns: 220px 1fr; gap: 1.5rem; }
  #threads { list-style: none; padding: 0; }
  #threads button { width: 100%; text-align: left; margin-bottom: .35rem; }
  #threads button.active { background: #d7e9ff; }
  #events { list-style: none; padding: 0; min-height: 100px; }
  #events li { border-bottom: 1px solid #ddd; padding: .6rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  small, #status { color: #59636e; }
  .error { color: #ad1b1b !important; }
  @media (max-width: 600px) { #layout { grid-template-columns: 1fr; } }
</style>
<h1>Realtime threads</h1>
<p>Open this page twice. Create a thread or post an event in either window.</p>
<form id="connect-form">
  <input id="server-url" aria-label="Server URL" placeholder="http://localhost:3000" required>
  <button>Connect</button>
</form>
<div id="status">Disconnected</div>
<div id="layout">
  <section>
    <h2>Threads</h2>
    <form id="thread-form"><input id="title" placeholder="Thread title" required maxlength="200"><button>Create</button></form>
    <ul id="threads"></ul>
  </section>
  <section>
    <h2 id="thread-heading">Select a thread</h2>
    <ul id="events"></ul>
    <form id="event-form"><input id="body" placeholder="Event body" required maxlength="10000"><button>Post</button></form>
  </section>
</div>
<script type="module">
  const $ = (id) => document.getElementById(id);
  let base = '';
  let socket;
  let reconnectTimer;
  let selectedId = null;
  let threads = [];
  let events = [];

  function status(message, error = false) {
    $('status').textContent = message;
    $('status').className = error ? 'error' : '';
  }
  async function api(path, options) {
    const response = await fetch(base + path, options);
    const value = await response.json();
    if (!response.ok) throw new Error(value.error || `HTTP ${response.status}`);
    return value;
  }
  function renderThreads() {
    $('threads').replaceChildren(...threads.map((thread) => {
      const li = document.createElement('li');
      const button = document.createElement('button');
      button.textContent = thread.title;
      button.className = thread.id === selectedId ? 'active' : '';
      button.onclick = () => selectThread(thread.id);
      li.append(button);
      return li;
    }));
    $('thread-heading').textContent = threads.find((thread) => thread.id === selectedId)?.title || 'Select a thread';
    $('event-form').hidden = !selectedId;
  }
  function renderEvents() {
    $('events').replaceChildren(...events.map((event) => {
      const li = document.createElement('li');
      const body = document.createElement('div');
      const time = document.createElement('small');
      body.textContent = event.body;
      time.textContent = new Date(event.createdAt).toLocaleString();
      li.append(body, time);
      return li;
    }));
  }
  async function refreshThreads() {
    threads = await api('/api/threads');
    if (selectedId && !threads.some((thread) => thread.id === selectedId)) selectedId = null;
    renderThreads();
  }
  async function selectThread(id) {
    selectedId = id;
    events = [];
    renderThreads();
    renderEvents();
    await refreshEvents();
  }
  async function refreshEvents() {
    const id = selectedId;
    if (!id) return;
    const loaded = await api(`/api/threads/${id}/events`);
    if (selectedId === id) { events = loaded; renderEvents(); }
  }
  function connect() {
    clearTimeout(reconnectTimer);
    socket?.close();
    const serverUrl = new URL($('server-url').value);
    if (!['http:', 'https:'].includes(serverUrl.protocol)) throw new Error('Use an http:// or https:// server URL');
    base = serverUrl.origin;
    localStorage.setItem('realtime-threads-server', base);
    selectedId = null;
    threads = [];
    events = [];
    renderThreads();
    renderEvents();
    openSocket(base);
  }
  function openSocket(serverBase) {
    const wsUrl = serverBase.replace(/^http/, 'ws') + '/ws';
    const connection = new WebSocket(wsUrl);
    socket = connection;
    status(`Connecting to ${serverBase}…`);
    connection.onopen = async () => {
      if (socket !== connection) return;
      status(`Connected to ${serverBase}`);
      try { await refreshThreads(); await refreshEvents(); }
      catch (error) { status(error.message, true); }
    };
    connection.onmessage = async ({ data }) => {
      if (socket !== connection) return;
      try {
        const { threadId } = JSON.parse(data);
        if (threadId === null) await refreshThreads();
        if (threadId === selectedId) await refreshEvents();
      } catch (error) { status(error.message, true); }
    };
    connection.onclose = () => {
      if (socket !== connection) return;
      status(`Disconnected from ${serverBase}; retrying…`, true);
      reconnectTimer = setTimeout(() => openSocket(serverBase), 1500);
    };
    connection.onerror = () => connection.close();
  }
  $('connect-form').onsubmit = (event) => {
    event.preventDefault();
    try { connect(); } catch (error) { status(error.message, true); }
  };
  $('thread-form').onsubmit = async (event) => {
    event.preventDefault();
    try {
      const thread = await api('/api/threads', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: $('title').value }),
      });
      $('title').value = '';
      await refreshThreads();
      await selectThread(thread.id);
    } catch (error) { status(error.message, true); }
  };
  $('event-form').onsubmit = async (event) => {
    event.preventDefault();
    try {
      await api(`/api/threads/${selectedId}/events`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body: $('body').value }),
      });
      $('body').value = '';
      await refreshEvents();
    } catch (error) { status(error.message, true); }
  };
  $('server-url').value = localStorage.getItem('realtime-threads-server') || location.origin;
  $('event-form').hidden = true;
  try { connect(); } catch (error) { status(error.message, true); }
</script>
</html>
